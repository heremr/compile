name: Build APK

# Sube a la raiz del repositorio SOLO el archivo .zip del proyecto (y este archivo en .github/workflows/build.yml).
# El workflow descomprime el zip y compila el APK.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descomprimir el zip del proyecto
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then echo "No hay ningun .zip en la raiz del repositorio"; exit 1; fi
          echo "Usando $ZIP"
          mkdir -p work
          unzip -q -o "$ZIP" -d work
          SETTINGS=$(find work -name settings.gradle -not -path "*/.git/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "El zip no contiene settings.gradle"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceptar licencias del Android SDK (usa el SDK ya instalado en el runner)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          mkdir -p "$SDK/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK/licenses/android-sdk-preview-license"
          echo "sdk.dir=$SDK" > "$PROJECT_DIR/local.properties"
          ls "$SDK/platforms" || true

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Compilar APK debug
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :android:assembleDebug --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: JhonHotelTest-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
